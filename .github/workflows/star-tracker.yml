name: Star Tracker

on:
  push:
    branches: [main]
    paths:
      - 'tools/star-tracker/**'
      - '.github/workflows/star-tracker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/star-tracker/**'
      - '.github/workflows/star-tracker.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: tools/star-tracker

jobs:
  build:
    runs-on: [self-hosted, wavekat-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/star-tracker/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx wrangler deploy --dry-run --outdir=dist

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, wavekat-ci]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/star-tracker/package-lock.json

      - run: npm ci

      - name: Apply D1 migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
