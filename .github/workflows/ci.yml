name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, wavekat-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Debug token reach
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_DOCS_TOKEN }}
        run: |
          echo "token set: ${GITHUB_TOKEN:+yes}, length: ${#GITHUB_TOKEN}"
          echo "--- global git config ---"
          git config --global --list || true
          echo "--- ls-remote with URL token ---"
          git ls-remote --tags --refs "https://x-access-token:${GITHUB_TOKEN}@github.com/wavekat/wavekat-voice.git" | head -5 \
            || echo "ls-remote FAILED"

      - run: npm run cf:build
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_DOCS_TOKEN }}
