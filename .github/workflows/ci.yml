name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, wavekat-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests for the build scripts' own helpers. Cheap, needs no build,
      # and runs before it so a broken helper fails in seconds not minutes.
      - run: npm test

      - run: npm run cf:build
        env:
          SYNC_DOCS_TOKEN: ${{ secrets.SYNC_DOCS_TOKEN }}

      # Catch broken internal links and locale leaks before they ship. Runs
      # against the full build above (docs synced), so /docs/voice/* is checked.
      - run: npm run check:links

      # Enforce the SERP snippet budgets in CLAUDE.md. Translations bust them
      # constantly — a truncated description costs clicks at a rank we already
      # earned, so this gates the build rather than living only in the docs.
      - run: npm run check:meta
