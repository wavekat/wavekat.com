name: Preview Deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      voice_ref:
        description: "wavekat-voice ref (branch/tag/sha) to pull docs from. Empty = default (latest tag)."
        required: false
        default: ""
      cli_ref:
        description: "wavekat-cli ref. Empty = default (latest tag)."
        required: false
        default: ""

permissions:
  pull-requests: write

jobs:
  deploy:
    runs-on: [self-hosted, wavekat-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # og:image has to be an absolute URL (LinkedIn and X won't resolve a
      # relative one), so on a preview it would otherwise point at production
      # — and 404 for any card that only exists on this branch. Point it at
      # this deploy instead. Everything else absolute on the page (canonical,
      # og:url, hreflang, the sitemap) deliberately stays on wavekat.com, so a
      # preview never canonicalises to itself.
      #
      # The branch alias is deterministic, which is what lets us know the URL
      # before the deploy that prints it: Cloudflare lowercases the branch,
      # collapses every run of non-alphanumerics to a dash, trims dashes from
      # the ends and truncates to 28 characters. `feat/og-images` →
      # `feat-og-images`.
      - name: Resolve this preview's own URL
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          ALIAS=$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-28 \
            | sed -E 's/-+$//')
          echo "SITE_ASSET_ORIGIN=https://${ALIAS}.wavekat-com.pages.dev" >> "$GITHUB_ENV"
          echo "OG images will resolve against https://${ALIAS}.wavekat-com.pages.dev"

      - run: npm run cf:build
        env:
          SYNC_DOCS_TOKEN: ${{ secrets.SYNC_DOCS_TOKEN }}
          SYNC_DOCS_REF_VOICE: ${{ inputs.voice_ref }}
          SYNC_DOCS_REF_CLI: ${{ inputs.cli_ref }}

      - name: Deploy preview
        id: deploy
        run: |
          OUTPUT=$(npx wrangler pages deploy ./dist --project-name=wavekat-com --branch="${{ github.head_ref || github.ref_name }}" 2>&1)
          echo "$OUTPUT"
          # POSIX sed rather than `grep -oP`: portable across the runner
          # pool, and it does not fail the step under `set -e` when the
          # deploy output carries no alias URL. See docs/06.
          ALIAS=$(printf '%s\n' "$OUTPUT" \
            | sed -nE 's|.*Deployment alias URL: (https://[^[:space:]]+).*|\1|p' \
            | tail -n 1)
          echo "url=${ALIAS}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🔗 Preview: ${{ steps.deploy.outputs.url }}
